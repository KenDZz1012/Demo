version: '3.4'

services:
  apigateway:
    image: ${DOCKER_REGISTRY}/apigateway
    build:
      context: .
      dockerfile: ApiGateway/ApiGateway/Dockerfile

  authorize.api:
    image: ${DOCKER_REGISTRY}/authorizeapi
    build:
      context: .
      dockerfile: Authorize/Authorize/Dockerfile

  identityserver:
    image: ${DOCKER_REGISTRY}/identityserver
    build:
      context: .
      dockerfile: IdentityServer/IdentityServer/Dockerfile

  account.api:
    image: ${DOCKER_REGISTRY}/accountapi
    build:
      context: .
      dockerfile: Services/Account/Account.API/Dockerfile
  
  lisdb:
    image: mcr.microsoft.com/mssql/server:2019-latest
    
  minio:
    image: minio/minio

