version: '3.4'

services:
  apigateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "9874:80"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    restart: unless-stopped

  catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "SQL_CONNECTION=Server=lisdb;Database=Catalog;User Id=sa;Password=Kienteo1012;TrustServerCertificate=True"
    ports:
      - "80"
    restart: unless-stopped


  patient.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "SQL_CONNECTION=Server=lisdb;Database=Patient;User Id=sa;Password=Kienteo1012;TrustServerCertificate=True"
    ports:
      - "80"
    restart: unless-stopped


  identityserver:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "80"
    restart: unless-stopped

  lisdb:
    user: root
    container_name: lisdb
    environment:
      - SA_PASSWORD=Kienteo1012
      - ACCEPT_EULA=Y
    restart: always
    ports: 
      - "1433:1433"
    volumes:
      - lisdb-data:/var/opt/mssql/data

  minio:
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./storage:/data
    environment:
      MINIO_ROOT_USER: kendz
      MINIO_ROOT_PASSWORD: kienteo1012
    command: server --console-address ":9001" /data
    restart: always
   
  elasticsearch:
    container_name: elasticsearch
    environment:
        - discovery.type=single-node
        - xpack.security.enabled=true  # Vẫn bật security nhưng không dùng SSL
        - xpack.security.http.ssl.enabled=false
        - xpack.security.transport.ssl.enabled=false
        - "ES_JAVA_OPTS=-Xms1g -Xmx1g"  # Tăng bộ nhớ heap
      # - xpack.security.http.ssl.keystore.path="elastic-certificates.p12"
      # - xpack.security.http.ssl.keystore.password="kien1012"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://localhost:9200
    ports:
      - "5601:5601" 
    restart: unless-stopped

  jenkins:
    container_name: jenkins
    ports:
      - "8080:8080"  # Giao diện Jenkins
      - "50000:50000"  # Kết nối với Jenkins agent
    volumes:
      - jenkins_home:/var/jenkins_home  # Lưu dữ liệu Jenkins
      - /var/run/docker.sock:/var/run/docker.sock  # Kết nối Docker host để build Docker containers (nếu cần)
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false # Bỏ qua trình cài đặt mặc định (tùy chọn)

  kong-database:
    container_name: kong-database
    restart: always
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - kong-database-data:/var/lib/postgresql/data

  kong-migrations:
    container_name: kong-migrations
    depends_on:
      - kong-database
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    command: kong migrations bootstrap
    restart: on-failure

  kong:
    container_name: kong
    depends_on:
      - kong-database
      - kong-migrations
    ports:
      - "8000:8000"    # Proxy
      - "8443:8443"    # Proxy (SSL)
      - "8001:8001"    # Admin API
      - "8444:8444"    # Admin API (SSL)
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444
    restart: always

  konga:
    image: pantsel/konga:latest
    container_name: konga
    restart: always
    ports:
      - "1337:1337"
    environment:
      DB_ADAPTER: postgres
      DB_HOST: kong-database
      DB_PORT: 5432
      DB_USER: kong
      DB_PASSWORD: kong
      DB_DATABASE: kong
    depends_on:
      - kong-database
volumes:
  lisdb-data:  
  elasticsearch_data:
    driver: local  
  jenkins_home:
  kong-database-data:

