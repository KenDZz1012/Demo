version: '3.4'

services:
  apigateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "9874:80"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    restart: unless-stopped

  catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "SQL_CONNECTION=Server=lisdb;Database=Catalog;User Id=sa;Password=Kienteo1012;TrustServerCertificate=True"
    ports:
      - "80"
    restart: unless-stopped


  patient.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "SQL_CONNECTION=Server=lisdb;Database=Patient;User Id=sa;Password=Kienteo1012;TrustServerCertificate=True"
    ports:
      - "80"
    restart: unless-stopped


  authorize:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "80"
    restart: unless-stopped

  lisdb:
    user: root
    container_name: lisdb
    environment:
      - SA_PASSWORD=Kienteo1012
      - ACCEPT_EULA=Y
    restart: always
    ports: 
      - "1433:1433"
    volumes:
      - lisdb-data:/var/opt/mssql/data


volumes:
  lisdb-data: