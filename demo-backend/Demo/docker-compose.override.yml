version: '3.4'

services:
  apigateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "9874:80"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    restart: unless-stop

  catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "SQL_CONNECTION=Server=catalogdb;Database=Catalog;User Id=sa;Password=Kienteo1012;TrustServerCertificate=True"
    ports:
      - "80"
    restart: unless-stop

  patient.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "80"
    restart: unless-stop


  authorize:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "80"
    restart: unless-stop

  catalogdb:
    container_name: catalogdb
    environment:
      SA_PASSWORD: "Kienteo1012"
      ACCEPT_EULA: "Y"
    restart: always
    ports: 
       - "1433:1433"
