  #     - JAVA_OPTS=-Djenkins.install.runSetupWizard=false # Bỏ qua trình cài đặt mặc định (tùy chọn)

  kong-database:
    container_name: kong-database
    restart: always
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - kong-database-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  kong-migrations:
    container_name: kong-migrations
    depends_on:
      - kong-database
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    command: kong migrations bootstrap
    restart: on-failure

  kong-node-1:
    container_name: kong-node-1
    depends_on:
      - kong-database
      - kong-migrations
    ports:
      - "8000:8000"  # Proxy
      - "8001:8001"  # Admin API
      - "8002:8002"  # Kong Manager
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
    restart: always
   
  kong-node-2:
    container_name: kong-node-2
    depends_on:
      - kong-database
      - kong-migrations
    ports:
      - "8005:8005"  # Proxy
      - "8006:8006"  # Admin API
      - "8007:8007"  # Kong Manager
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PROXY_LISTEN: 0.0.0.0:8005
      KONG_ADMIN_LISTEN: 0.0.0.0:8006
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8007
    restart: always

  # prometheus:
  #   container_name: prometheus
  #   volumes:
  #     - ./prometheus.yml/prometheus.yml:/etc/prometheus/prometheus.yml
  #   ports:
  #     - "9090:9090"

  grafana:
    container_name: grafana
    ports:
      - "3000:3000"

  keycloak:
    container_name: keycloak
    command: start --http-enabled=true --proxy=none --hostname-strict=false
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8080:8080"
volumes:
  lisdb-data:  
  elasticsearch_data:
    driver: local  
  jenkins_home:
  kong-database-data:

networks:
  elk:
    driver: bridge


