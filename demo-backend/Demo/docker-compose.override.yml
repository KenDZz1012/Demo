  kenverse-postgreSQL:
    user: root
    container_name: kenverse-postgreSQL
    mem_limit: 2g
    cpus: 0.7
    environment:
      - POSTGRES_USER=kendz
      - POSTGRES_PASSWORD=kienteo1012
      - POSTGRES_DB=kenverse_db
    restart: always
    ports: 
      - "6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  
  minio:
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./storage:/data
    environment:
      MINIO_ROOT_USER: kendz
      MINIO_ROOT_PASSWORD: kienteo1012
    command: server --console-address ":9001" /data
    restart: always
   
