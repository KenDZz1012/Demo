version: '2.4'

services:

  authorize.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "SQL_CONNECTION=Host=pg-database;Port=5432;Database=authorize;Username=kendz;Password=kienteo1012"
      - EmailSettings__ApiKey
      - EmailSettings__FromAddress=kienteo1012@gmail.com
      - EmailSettings__FromName=KenVerse
    ports:
      - "8083:80"
    restart: unless-stopped
    depends_on:
      pg-database:
        condition: service_healthy

  account.api:
    environment:  
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "SQL_CONNECTION=Host=pg-database;Port=5432;Database=account;Username=postgres;Password=postgres"
      - "MINIO_CONNECTION=localhost;9000;kendz;kienteo1012"
      - Redis_Host=redis
    ports:
      - "8082:80"
    restart: unless-stopped
    depends_on:
      pg-database:
        condition: service_healthy
    
  
  minio:
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./storage:/data
    environment:
      MINIO_ROOT_USER: kendz
      MINIO_ROOT_PASSWORD: kienteo1012
    command: server --console-address ":9001" /data
    restart: always

  pg-database:
    container_name: pg-database
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg-database-data:/var/lib/postgresql/data
      - ./initDB.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "6000:5432"
    mem_limit: 1g
    cpus: 0.5
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=2MB
      -c effective_cache_size=512MB
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      retries: 5

  kong-migrations:
    container_name: kong-migrations
    depends_on:
      - pg-database
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: pg-database
      KONG_PG_USER: postgres
      KONG_PG_PASSWORD: postgres
    command: kong migrations bootstrap
    restart: on-failure

  kong-node-1:
    container_name: kong-node-1
    depends_on:
      - pg-database
      - kong-migrations
    ports:
      - "8000:8000"  # Proxy
      - "8001:8001"  # Admin API
      - "8002:8002"  # Kong Manager
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: pg-database
      KONG_PG_USER: postgres
      KONG_PG_PASSWORD: postgres
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_DB_CACHE_TTL: 3600
    restart: always

  channel.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "SQL_CONNECTION=Host=pg-database;Port=5432;Database=channel;Username=postgres;Password=postgres"
      - "MINIO_CONNECTION=localhost;9000;kendz;kienteo1012"
      - "ElasticConfiguration__Uri=http://elasticsearch:9200"
    ports:
      - "8081:80"
    depends_on:
      pg-database:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
        
  guild.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "SQL_CONNECTION=Host=pg-database;Port=5432;Database=guild;Username=postgres;Password=postgres"
      - "MINIO_CONNECTION=localhost;9000;kendz;kienteo1012"
    ports:
      - "8084:80"
    depends_on:
      pg-database:
        condition: service_healthy
        
  notification.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "SQL_CONNECTION=Host=pg-database;Port=5432;Database=notification;Username=postgres;Password=postgres"
      - "MINIO_CONNECTION=localhost;9000;kendz;kienteo1012"
    ports:
      - "8085:80"
    depends_on:
      pg-database:
        condition: service_healthy
        
  media.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "SQL_CONNECTION=Host=pg-database;Port=5432;Database=media;Username=postgres;Password=postgres"
      - "MINIO_CONNECTION=localhost;9000;kendz;kienteo1012"
    ports:
      - "8086:80"
    depends_on:
      pg-database:
        condition: service_healthy
  
  
  redis:
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]


#  directmessage.api:
#    environment:
#      - ASPNETCORE_ENVIRONMENT=Development
#      - SCYLLA_DB_HOST=103.82.25.49
#      - SCYLLA_DB_KEYSPACE=DirectMessage
#    ports:
#      - "8084:80"


  elasticsearch:
    container_name: elasticsearch
    environment:
      - xpack.monitoring.enabled=true
      - xpack.watcher.enabled=false
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    
  kibana:
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped
    
volumes:
  elasticsearch_data:
#    driver: local  
##  jenkins_home:
  pg-database-data:
  redis_data:
#  portainer_data:
#  postgres_data:

networks:
  elk:
    driver: bridge
  backend:
    driver: bridge






