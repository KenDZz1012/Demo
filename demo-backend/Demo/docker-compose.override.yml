  presence:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Redis_Host=redis
    ports:
      - "5080:80"
    depends_on:
      - redis


  channel.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - "SQL_CONNECTION=Host=103.82.25.49;Port=6543;Database=channel;Username=kendz;Password=kienteo1012"
      - "MINIO_CONNECTION=103.82.25.49;9000;kendz;kienteo1012"
    ports:
      - "8081:80"

  redis:
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]


  portainer:
    container_name: portainer
    restart: unless-stopped
    ports:
      - "8050:8000"
      - "9009:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    environment:
      - TZ=Asia/Ho_Chi_Minh

  account.grpc:
