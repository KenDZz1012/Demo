  kong-database:
    container_name: kong-database
    restart: always
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - kong-database-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=4MB
      -c effective_cache_size=1GB
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1g

  kong-migrations:
    container_name: kong-migrations
    depends_on:
      - kong-database
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    command: kong migrations bootstrap
    restart: on-failure

  kong-node-1:
    container_name: kong-node-1
    depends_on:
      - kong-database
      - kong-migrations
    ports:
      - "8000:8000"  # Proxy
      - "8001:8001"  # Admin API
      - "8002:8002"  # Kong Manager
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_DB_CACHE_TTL: 3600
    restart: always
   
  kong-node-2:
    container_name: kong-node-2
    depends_on:
      - kong-database
      - kong-migrations
    ports:
      - "8005:8005"  # Proxy
      - "8006:8006"  # Admin API
      - "8007:8007"  # Kong Manager
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PROXY_LISTEN: 0.0.0.0:8005
      KONG_ADMIN_LISTEN: 0.0.0.0:8006
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8007
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_DB_CACHE_TTL: 3600
    restart: always

  # prometheus:
  #   container_name: prometheus
  #   volumes:
  #     - ./prometheus.yml/prometheus.yml:/etc/prometheus/prometheus.yml
  #   ports:
  #     - "9090:9090"

  # grafana:
  #   container_name: grafana
  #   ports:
  #     - "3000:3000"

  presence:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Redis_Host=redis
    ports:
      - "5080:80"
    depends_on:
      - redis


  channel.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "80"

  redis:
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]


  portainer:
    container_name: portainer
    restart: unless-stopped
    ports:
      - "8050:8000"
      - "9009:9000"  # Cổng cho giao diện web
      # Bỏ cổng 8000 vì đã bị Kong sử dụng
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    environment:
      - TZ=Asia/Ho_Chi_Minh  # Múi giờ (tùy chọn)

  account.grpc:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "SQL_CONNECTION=Server=lisdb;Database=User;User Id=sa;Password=Kienteo1012;TrustServerCertificate=True"
    ports:
      - "8011:80"

volumes:
  lisdb-data:  
  elasticsearch_data:
    driver: local  
  jenkins_home:
  kong-database-data:
  redis_data:
  portainer_data:

networks:
  elk:
    driver: bridge
  backend:
    driver: bridge





