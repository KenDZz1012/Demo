<div class="kv-auth-page">
  <div class="kv-auth-brand">
    <div class="kv-auth-brand__logo">
      <img src="/logo.svg" alt="KenVerse" />
    </div>
    <span class="kv-auth-brand__name">KenVerse</span>
  </div>

  <div class="kv-auth-card">
    <h1 class="kv-auth-card__title">Welcome back!</h1>
    <p class="kv-auth-card__subtitle">We're so excited to see you again!</p>

    <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()">
      <nz-form-item>
        <nz-form-label nzNoColon>
          <span class="kv-label">Email or Username</span>
          <span class="kv-label__required"> *</span>
          @if (errors['userName']) {
            <span class="kv-label__error"> — {{ errors['userName'] }}</span>
          }
        </nz-form-label>
        <nz-form-control>
          <app-custom-input formControlName="userName" placeholder="Enter your username" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzNoColon>
          <span class="kv-label">Password</span>
          <span class="kv-label__required"> *</span>
          @if (errors['password']) {
            <span class="kv-label__error"> — {{ errors['password'] }}</span>
          }
        </nz-form-label>
        <nz-form-control>
          <app-custom-password-input formControlName="password" placeholder="Enter your password" [visibilityToggle]="false" />
        </nz-form-control>
      </nz-form-item>

      <app-custom-button
        type="primary"
        htmlType="submit"
        size="large"
        [loading]="loading"
        [block]="true"
        class="kv-btn-primary"
      >
        Log In
      </app-custom-button>
    </form>

    <div class="kv-auth-card__footer">
      Need an account? <a routerLink="/register">Register</a>
    </div>
  </div>
</div>
