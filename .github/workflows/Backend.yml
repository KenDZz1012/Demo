name: Docker Image CI

on:
  push:
    branches: ["main"]

jobs:
  docker-login:
    runs-on: ubuntu-latest
    steps:
      - name: Login container docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  build:
    runs-on: ubuntu-latest
    needs: docker-login
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v2

      - name: Build image
        run: |
          export DOCKER_REGISTRY=${{ secrets.DOCKER_USER }}
          docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASSWORD }}
          cd demo-backend/demo
          docker compose build
          docker compose push

      - name: "Upload Docker compose backend"
        uses: actions/upload-artifact@v4
        with:
          name: key-docker-compose-backend
          path: |
            demo-backend/demo/docker-compose.yml
          retention-days: 5
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download docker-compose backend
        uses: actions/download-artifact@v4
        with:
          name: key-docker-compose-backend

      - name: Check dictionary
        run: ls -a

      - name: copy file via ssh password
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_DEPLOY_IP }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.SSH_DEPLOY_USER }}
          password: ${{ secrets.SSH_DEPLOY_PASSWORD }}
          source: "docker-compose.yml"
          target: "app/demo-backend/demo"

      - name: Connection SSH - build server docker compose
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_DEPLOY_IP }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.SSH_DEPLOY_USER }}
          password: ${{ secrets.SSH_DEPLOY_PASSWORD }}
          script: |
            cd app/demo-backend/demo
            sed -i '/build:\|context:\|dockerfile:/d' docker-compose.yml
            docker-compose down
            docker-compose pull
            docker-compose up -d --build
