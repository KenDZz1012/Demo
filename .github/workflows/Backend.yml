name: Backend

on:
  push:
    branches: ["main"]

jobs:
  docker-login:
    runs-on: ubuntu-latest
    steps:
      - name: Login container docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  build:
    runs-on: ubuntu-latest
    needs: docker-login
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v2

      - name: Run SQL Server backup
        uses: docker://mcr.microsoft.com/mssql-tools:latest
        with:
          entrypoint: /bin/bash
          args: |
            /opt/mssql-tools/bin/sqlcmd -S ${{ secrets.SSH_DEPLOY_IP }} -U sa -P ${{ secrets.SQL_SERVER_PASSWORD }} -Q "BACKUP DATABASE [Catalog] TO DISK = N'/tmp/Catalog.bak'"
          platform: linux/amd64

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: /tmp/Catalog.bak

      - name: Build image
        run: |
          export DOCKER_REGISTRY=${{ secrets.DOCKER_USER }}
          docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASSWORD }}
          cd demo-backend/Demo
          docker compose -f docker-compose.yml -f docker-compose.override.yml build
          docker compose -f docker-compose.yml -f docker-compose.override.yml push

      - name: "Upload Docker compose backend"
        uses: actions/upload-artifact@v4
        with:
          name: key-docker-compose-backend
          path: |
            demo-backend/Demo/docker-compose.yml
            demo-backend/Demo/docker-compose.override.yml
          retention-days: 5
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download docker-compose backend
        uses: actions/download-artifact@v4
        with:
          name: key-docker-compose-backend

      - name: Check dictionary
        run: ls -a

      - name: copy file via ssh password
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_DEPLOY_IP }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.SSH_DEPLOY_USER }}
          password: ${{ secrets.SSH_DEPLOY_PASSWORD }}
          source: "docker-compose.yml,docker-compose.override.yml"
          target: "app/demo-backend/Demo"

      - name: Connection SSH - build server docker compose
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_DEPLOY_IP }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.SSH_DEPLOY_USER }}
          password: ${{ secrets.SSH_DEPLOY_PASSWORD }}
          script: |
            cd app/demo-backend/Demo
            sed -i '/build:\|context:\|dockerfile:/d' docker-compose.yml
            docker-compose down
            docker-compose pull
            docker-compose -f docker-compose.yml -f docker-compose.override.yml up -d --build

      - name: Download database backup
        uses: actions/download-artifact@v4
        with:
          name: database-backup

      - name: Restore database from backup
        uses: docker://mcr.microsoft.com/mssql-tools:latest
        with:
          entrypoint: /bin/bash
          args: |
            /opt/mssql-tools/bin/sqlcmd -S sqlserver-container -U sa -P ${{ secrets.SQL_SERVER_PASSWORD }} -Q "RESTORE DATABASE [Catalog] FROM DISK = N'/tmp/Catalog.bak'"
          platform: linux/amd64
